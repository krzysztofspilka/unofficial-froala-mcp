name: Bug report
description: A tool returned something wrong, or the setup code did not work.
body:
  - type: input
    id: tool
    attributes:
      label: Tool
      description: For example froala_get_setup.
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: What you sent
      description: The tool input, without licence keys or private code.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Your framework, your bundler and Froala.
