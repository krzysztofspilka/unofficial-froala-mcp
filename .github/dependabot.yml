version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      mcp-sdk:
        patterns: ['@modelcontextprotocol/*']
      tooling:
        patterns: ['*']
        exclude-patterns: ['@modelcontextprotocol/*', 'froala-editor']
    ignore:
      - dependency-name: froala-editor
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
